name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nocturne
          POSTGRES_PASSWORD: nocturne
          POSTGRES_DB: nocturne
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: nocturne
      DB_PASSWORD: nocturne
      DB_NAME: nocturne
      JWT_SECRET: ci-only-secret-not-for-production
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 30d
      ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
      # Admin de pruebas: lo crea el paso "Seed admin" y es con quien las e2e
      # inician sesión. Valores propios del CI, nunca los de producción.
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # La Postgres del job arranca vacía: las e2e necesitan el esquema y el
      # usuario admin, igual que en local (README, "Cómo correrlo").
      # Primero la tabla `users`, que es anterior a las migraciones (ver el
      # .sql); después las migraciones y el admin, sobre el build de arriba.
      - name: Create pre-migration schema
        run: psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_NAME" -f .github/ci/phase0-users.sql
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}

      - name: Run migrations
        run: npm run typeorm -- migration:run

      - name: Seed admin
        run: node dist/seed.js

      - name: E2E tests
        run: npm run test:e2e
