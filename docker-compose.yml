services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-nocturne}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nocturne}
      POSTGRES_DB: ${DB_NAME:-nocturne}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - nocturne_postgres_data:/var/lib/postgresql/data

volumes:
  nocturne_postgres_data:
